# repoheart.yml — RepoHeart configuration
#
# Generated by `repoheart init`. Edit as needed.
# Only `provider` and at least one enabled agent are required.

repoheart:

  provider:
    name: opencode
    model: mimo-v2.5-free

  agents:
    issue_triage: true  # label and prioritize new issues
    duplicate_detection: true  # detect and link duplicate issues
    issue_resolution: true  # suggest fixes for open issues
    pr_review: true  # review pull request code changes
    code_quality: true  # flag style, complexity, and maintainability issues
    security: true  # scan for secrets and vulnerability patterns
    ci_repair: true  # diagnose and suggest fixes for failing CI
    conflict_resolution: true  # detect and help resolve merge conflicts
    test: true  # suggest missing tests for changed code
    documentation: true  # keep docs and changelogs in sync with code

  automation:
    level: auto-safe
    require_human_approval:
      - HIGH
      - MEDIUM

  scale:
    checkout: event-scoped
    retrieval:
      semantic: false
    cache:
      backend: actions
    limits:
      max_llm_calls: 30
      max_files_read: 200
      max_runtime_seconds: 600
